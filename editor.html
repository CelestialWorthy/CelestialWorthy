<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Studio Editor - Alcrazhy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="top">
  <a href="index.html" class="ib">←</a>
  <div class="ttl">Editor Halaman Utama</div>
  <button type="button" class="save" id="saveEditorBtn">Simpan</button>
</header>

<section class="edit-panel">
  <div class="edit-group">
    <label for="editAvatarFile">Avatar Komunitas (media/)</label>
    <input type="file" id="editAvatarFile" accept="image/png,image/jpeg,image/webp">
    <button type="button" id="resetAvatarBtn">Hapus Avatar</button>
  </div>
  <div class="edit-group">
    <label for="editBannerFile">Banner Komunitas (media/)</label>
    <input type="file" id="editBannerFile" accept="image/png,image/jpeg,image/webp">
    <button type="button" id="resetBannerBtn">Hapus Banner</button>
  </div>
</section>

<main class="viewport">
  <div class="stage pg" id="pstage">
    <div id="fw"><iframe id="frame" src="index.html"></iframe></div>
  </div>
</main>

<div class="chips" id="chips"></div>
<section class="tl" id="tl">
  <div class="tlin" id="tlin">
    <div class="tracks" id="tracks"></div>
  </div>
</section>

<nav class="tools" id="tools">
  <button type="button" data-sheet="move"><i>✥</i>Move &amp; Transform</button>
  <button type="button" data-sheet="fill"><i>💧</i>Color &amp; Fill</button>
  <button type="button" data-sheet="border"><i>▢</i>Border &amp; Bayangan</button>
  <button type="button" data-sheet="blend"><i>▧</i>Blending &amp; Opacity</button>
  <button type="button" data-sheet="edit"><i>✏️</i>Edit Konten</button>
  <button type="button" id="bReset"><i>↺</i>Reset</button>
  <button type="button" id="bHide" class="del"><i>🚫</i>Sembunyikan</button>
</nav>

<div class="sheet" id="sheet"></div>
<input type="file" id="file" accept="image/*" hidden>

<div class="auth-gate" id="editorAuthGate">
  <div class="auth-box">
    <h3>Login Admin Editor</h3>
    <p>Masuk dengan akun admin untuk mengedit tampilan, avatar, dan banner.</p>
    <form id="editorAuthForm">
      <div class="auth-field">
        <label for="edAuthEmail">Email Admin</label>
        <input type="email" id="edAuthEmail" required placeholder="admin@email.com">
      </div>
      <div class="auth-field">
        <label for="edAuthPass">Kata Sandi</label>
        <input type="password" id="edAuthPass" required placeholder="••••••••">
      </div>
      <div class="auth-actions">
        <a href="index.html" class="auth-btn-cancel">Kembali</a>
        <button type="submit" class="save" style="flex:1">Masuk</button>
      </div>
    </form>
  </div>
</div>

<script src="tampilan.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
