<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Studio Editor - Alcrazhy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css?v=4">
</head>
<body>
<header class="top">
  <a href="index.html" class="ib">←</a>
  <div class="seg">
    <button id="mK" class="on" onclick="setMode('kartu')">Kartu</button>
    <button id="mH" onclick="setMode('halaman')">Halaman Utama</button>
  </div>
  <button class="save" onclick="saveProject()">Simpan</button>
</header>

<section class="edit-panel">
  <div class="edit-group">
    <label for="editAvatarFile">Avatar Komunitas</label>
    <input type="file" id="editAvatarFile" accept="image/png,image/jpeg">
    <button type="button" id="resetAvatarBtn">Hapus Avatar</button>
  </div>
  <div class="edit-group">
    <label for="editBannerFile">Banner Komunitas</label>
    <input type="file" id="editBannerFile" accept="image/png,image/jpeg">
    <button type="button" id="resetBannerBtn">Hapus Banner</button>
  </div>
</section>

<main class="viewport">
  <div class="stage" id="stage">
    <div class="card lyr" id="profile" data-id="profile">
      <div class="banner" id="pBanner"></div>
      <div class="pmain">
        <img id="pAvatar" alt="">
        <h2 id="pName"></h2>
        <p id="pHandle"></p>
        <p id="pBio" class="bio"></p>
      </div>
    </div>
  </div>
  <div class="stage pg" id="pstage" style="display:none">
    <div id="fw"><iframe id="frame" src="index.html?v=4"></iframe></div>
  </div>
</main>

<div class="play">
  <button class="pbtn" id="playBtn" onclick="togglePlay()">▶</button>
  <span class="time"><b id="tNow">0:00.0</b> / <span id="tTot">0:10.0</span></span>
  <span class="cnt" id="cnt"></span>
</div>

<div class="chips" id="chips" style="display:none"></div>
<section class="tl" id="tl">
  <div class="tlin" id="tlin">
    <div class="ruler" id="ruler"></div>
    <div class="tracks" id="tracks"></div>
    <div class="head" id="head"></div>
  </div>
</section>

<nav class="tools" id="tools">
  <button onclick="sheet('move')"><i>✥</i>Move &amp; Transform</button>
  <button onclick="sheet('fill')"><i>💧</i>Color &amp; Fill</button>
  <button onclick="sheet('border')"><i>▢</i>Border &amp; Bayangan</button>
  <button onclick="sheet('blend')"><i>▧</i>Blending &amp; Opacity</button>
  <button onclick="sheet('edit')"><i>✏️</i>Edit Konten</button>
  <button id="bDup" onclick="dupLayer()"><i>⧉</i>Duplikat</button>
  <button id="bDel" class="del" onclick="delLayer()"><i>🗑</i>Hapus</button>
</nav>

<button class="fab" onclick="sheet('add')">＋</button>
<div class="sheet" id="sheet"></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="github_storage.js?v=4"></script>
<script type="module" src="firebase-auth.js?v=4"></script>
<script src="tampilan.js?v=4"></script>
<script src="editor.js?v=4"></script>
<script>
  window.addEventListener("DOMContentLoaded", async () => {
    document.body.style.visibility = "hidden";
    const check = setInterval(async () => {
      if (!window.AlcrazhyAuth) return;
      clearInterval(check);
      const ok = await window.AlcrazhyAuth.requireAdminLogin();
      if (ok) {
        document.body.style.visibility = "visible";
      } else {
        location.href = "index.html";
      }
    }, 50);
  });
</script>
</body>
</html>
