<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Studio Editor - Alcrazhy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editor.css?v=5">
</head>
<body>
<header class="top">
  <a href="index.html" class="ib">←</a>
  <div class="ttl">Editor Halaman Utama</div>
  <button type="button" class="save" onclick="saveProject()">Simpan</button>
</header>

<section class="edit-panel">
  <div class="edit-group">
    <label for="editAvatarFile">Avatar Komunitas</label>
    <input type="file" id="editAvatarFile" accept="image/png,image/jpeg">
    <button type="button" id="resetAvatarBtn">Hapus Avatar</button>
  </div>
  <div class="edit-group">
    <label for="editBannerFile">Banner Komunitas</label>
    <input type="file" id="editBannerFile" accept="image/png,image/jpeg">
    <button type="button" id="resetBannerBtn">Hapus Banner</button>
  </div>
</section>

<main class="viewport">
  <div class="stage pg" id="pstage">
    <div id="fw"><iframe id="frame" src="index.html?v=5"></iframe></div>
  </div>
</main>

<div class="chips" id="chips"></div>

<section class="tl" id="tl">
  <div class="tlin" id="tlin">
    <div class="tracks" id="tracks"></div>
  </div>
</section>

<nav class="tools" id="tools">
  <button type="button" onclick="sheet('move')"><i>✥</i>Move &amp; Transform</button>
  <button type="button" onclick="sheet('fill')"><i>💧</i>Color &amp; Fill</button>
  <button type="button" onclick="sheet('border')"><i>▢</i>Border &amp; Bayangan</button>
  <button type="button" onclick="sheet('blend')"><i>▧</i>Blending &amp; Opacity</button>
  <button type="button" onclick="sheet('edit')"><i>✏️</i>Edit Konten</button>
  <button type="button" id="bDup" onclick="resetSelectedUI()"><i>↺</i>Reset</button>
  <button type="button" id="bDel" class="del" onclick="toggleHideUI()"><i>🚫</i>Sembunyikan</button>
</nav>

<div class="sheet" id="sheet"></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="github_storage.js?v=5"></script>
<script type="module" src="firebase-auth.js?v=5"></script>
<script src="tampilan.js?v=5"></script>
<script src="editor.js?v=5"></script>
<script>
  window.addEventListener("DOMContentLoaded", async () => {
    document.body.style.visibility = "hidden";
    const check = setInterval(async () => {
      if (!window.AlcrazhyAuth) return;
      clearInterval(check);
      const ok = await window.AlcrazhyAuth.requireAdminLogin();
      if (ok) {
        document.body.style.visibility = "visible";
      } else {
        location.href = "index.html";
      }
    }, 50);
  });
</script>
</body>
</html>
